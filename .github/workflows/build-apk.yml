
name: Build KasKu APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
          if [ -n "$ZIP" ]; then unzip -o "$ZIP" -d extracted; fi
          if [ -d extracted ]; then
            find extracted -name settings.gradle.kts -print -quit
          fi

      - name: Build APK
        run: |
          if [ -f settings.gradle.kts ]; then
            gradle assembleDebug
          else
            echo "Project ZIP belum berada pada struktur folder yang benar."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: KasKu-APK
          path: app/build/outputs/apk/debug/*.apk
